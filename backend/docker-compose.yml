version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=ewaste
      - POSTGRES_PASSWORD=ewaste_password
      - POSTGRES_DB=ewaste_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app

  db:
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_USER=ewaste
      - POSTGRES_PASSWORD=ewaste_password
      - POSTGRES_DB=ewaste_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewaste -d ewaste_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:

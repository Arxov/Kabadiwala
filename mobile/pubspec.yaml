name: ewaste_connect
description: E-Waste Connect Informal Collector Mobile Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^8.1.0
  drift: ^2.14.0
  drift_sqflite: ^2.14.0
  dio: ^5.0.0
  tflite_flutter: ^0.10.0
  camera: ^0.10.0
  geolocator: ^11.0.0
  flutter_tts: ^4.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  workmanager: ^0.5.0
  connectivity_plus: ^6.0.0
  fl_chart: ^0.66.0
  cached_network_image: ^3.3.0
  get_it: ^7.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  drift_dev: ^2.14.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/audio/
  fonts:
    - family: AppIcons
      fonts:
        - asset: assets/fonts/AppIcons.ttf
